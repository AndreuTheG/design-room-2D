<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planta · Diseñador de planos 2D</title>
<style>
:root{
  --paper:#F4F6F3;
  --panel:#FFFFFF;
  --ink:#1C2420;
  --ink-2:#4A544F;
  --muted:#879089;
  --line:#E3E7E2;
  --line-2:#D1D7D1;
  --field:#F4F6F3;
  --accent:#1E7B5F;
  --accent-ink:#145A45;
  --accent-soft:rgba(30,123,95,.12);
  --danger:#D64545;
  --font:"Avenir Next","Avenir","Segoe UI Variable Text","Segoe UI","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;font:13px/1.45 var(--font);color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ── Panel lateral ── */
#sidebar{width:316px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0;z-index:2}
.sb-head{display:flex;align-items:center;gap:2px;padding:14px 12px 10px 18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-size:16px;font-weight:600;letter-spacing:-.015em}
.brand svg{display:block}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border:0;border-radius:8px;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--field);color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 0 10px;cursor:pointer;color:var(--muted);font-weight:500;position:relative}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
#panel{flex:1;overflow-y:auto;padding:0 18px 28px;scrollbar-width:thin}
.sec{padding:16px 0 18px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:13px;font-weight:600}
.sec-title small{font-weight:400;color:var(--muted);font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ── Controles ── */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span:first-child{font-size:12px;color:var(--ink-2)}
.inp{position:relative;display:flex;align-items:center;min-width:0}
.inp input{width:100%;min-width:0;height:32px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0 24px 0 9px;font:inherit;color:var(--ink);outline:none;transition:border-color .12s,background .12s,box-shadow .12s}
.inp.nounit input{padding-right:9px}
.inp input:hover{border-color:var(--line-2)}
.inp input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.inp em{position:absolute;right:9px;font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.seg{display:flex;gap:2px;padding:2px;background:var(--field);border:1px solid var(--line);border-radius:9px}
.seg button{flex:1 1 auto;min-width:0;border:0;background:transparent;border-radius:7px;padding:5px 6px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-size:12.5px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(28,36,32,.07)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line-2);background:#fff;border-radius:9px;cursor:pointer;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--field)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#2E3833}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:#FDF1F1;border-color:#F0CACA}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default;background:#fff}
.row-actions{display:flex;gap:8px}
.row-actions .btn{flex:1}
.row-actions .btn.danger{flex:0 0 40px;padding:0}
.prev-box{position:relative;display:grid;place-items:center;height:108px;margin:12px 0;border-radius:10px;background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:12px 12px;background-position:-1px -1px}
.prev-box span{position:absolute;right:9px;bottom:7px;font-size:11.5px;color:var(--ink-2);background:rgba(255,255,255,.85);padding:1px 6px;border-radius:5px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 2px 9px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink-2);font-size:12px}
.tool:hover{border-color:var(--line-2);color:var(--ink);background:var(--field)}
.tool.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.list{display:flex;flex-direction:column;margin:0 -8px}
.list-row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink)}
.list-row:hover{background:var(--field)}
.list-row svg{color:var(--ink-2);flex:none}
.swatch-dot{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.list-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .val{color:var(--ink-2);white-space:nowrap}
.total{display:flex;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line-2);font-weight:600}
.cat{margin-top:16px}
.cat-name{font-size:12px;color:var(--muted);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{display:flex;align-items:center;gap:9px;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:grab;text-align:left;user-select:none;-webkit-user-select:none}
.tile:hover{border-color:var(--line-2);background:var(--field)}
.tile svg{flex:none}
.tile div{min-width:0}
.tile b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:12.5px;line-height:1.25}
.tile small{display:block;color:var(--muted);font-size:11px}
.insp-head{display:flex;align-items:center;gap:6px;padding:12px 0 10px;margin-left:-6px}
.insp-titles{min-width:0}
.insp-head .kind{font-size:12px;color:var(--muted);line-height:1.2}
.insp-head .title{font-size:15px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.walls-head,.wall-row{display:grid;grid-template-columns:22px 1fr 76px 28px 28px;gap:6px;align-items:center}
.walls-head{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.wall-row{padding:3px 0}
.wall-row .idx{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--field);font-size:11.5px;color:var(--ink-2);font-weight:600;transition:background .12s,color .12s}
.wall-row:hover .idx,.wall-row:focus-within .idx,.wall-row.hl .idx{background:var(--accent);color:#fff}
.wall-row .icon-btn{width:28px;height:28px}
.swatches{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px}
.sw{width:100%;aspect-ratio:1;height:auto;border-radius:6px;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.sw-custom{position:relative;overflow:hidden;background:conic-gradient(#E57373,#FFD54F,#81C784,#4FC3F7,#9575CD,#E57373)}
.sw-custom input{position:absolute;inset:-8px;width:40px;height:40px;opacity:0;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:9px 11px;background:var(--field);border-radius:10px}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.warn{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:#FCEFEF;color:#9E2F2F;font-size:12.5px;line-height:1.4}
.warn svg{flex:none;margin-top:1px}
.rot-row{display:grid;grid-template-columns:1fr 76px;gap:10px;align-items:center}
input[type=range]{width:100%;margin:0;accent-color:var(--ink)}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{flex:1;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--field)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:4px 0;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink)}
.switch i{flex:none;width:30px;height:18px;border-radius:9px;background:var(--line-2);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch.on i{background:var(--accent)}
.switch.on i::after{transform:translateX(12px)}

/* ── Lienzo ── */
#stage{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--font)}
#svg.c-grab,#svg.c-grab *{cursor:grab!important}
#svg.c-grabbing,#svg.c-grabbing *{cursor:grabbing!important}
#svg.c-cross,#svg.c-cross *{cursor:crosshair!important}
.hud{position:absolute;display:flex;align-items:center}
.hud-br{right:16px;bottom:16px;gap:2px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:0 1px 3px rgba(28,36,32,.06)}
.hud .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.zoom-label{min-width:50px;height:30px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.zoom-label:hover{background:var(--field)}
.hud-bl{left:18px;bottom:22px;pointer-events:none}
#scalebar{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink-2)}
#scalebar i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
.hud-bc{left:50%;transform:translateX(-50%);bottom:18px;gap:16px;pointer-events:none;font-size:12px;color:var(--ink-2);background:rgba(255,255,255,.9);padding:6px 12px;border-radius:9px;border:1px solid var(--line);white-space:nowrap;max-width:calc(100% - 400px);overflow:hidden}
kbd{font:inherit;font-size:11px;padding:0 5px;border-radius:5px;background:var(--field);border:1px solid var(--line-2);color:var(--ink)}
#modebar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;background:var(--ink);color:#fff;border-radius:11px;box-shadow:0 8px 24px rgba(28,36,32,.18);font-size:12.5px;white-space:nowrap;z-index:4}
#modebar span{margin-right:6px}
#modebar button{height:28px;padding:0 11px;border-radius:7px;border:0;cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
#modebar button:hover{background:rgba(255,255,255,.24)}
#modebar button.primary{background:#fff;color:var(--ink)}
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 40px);background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(28,36,32,.12);font-size:12.5px;z-index:5}
#toast.err{border-color:#F0CACA;color:#9E2F2F}
#toast.below{top:62px}
.menu-wrap{position:relative}
.menu{position:absolute;top:36px;right:0;width:230px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 32px rgba(28,36,32,.14);padding:5px;z-index:20}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--field)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#ghost{position:fixed;pointer-events:none;z-index:50;padding:5px 10px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;transform:translate(12px,12px)}
body.dragging,body.dragging *{cursor:grabbing!important}

@media (max-width:760px){
  body{flex-direction:column-reverse}
  #sidebar{width:100%;height:46vh;border-right:0;border-top:1px solid var(--line)}
  .hud-bc{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


  
<aside id="sidebar">
  <header class="sb-head">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 2h18v18h-6v-3h3V5H5v12h3v3H2Z" fill="#1C2420"/><path d="M8 17v-6" stroke="#1E7B5F" stroke-width="1.6" stroke-linecap="round"/><path d="M8 11a6 6 0 0 1 6 6" fill="none" stroke="#1E7B5F" stroke-width="1.2" stroke-dasharray="1.6 1.4"/></svg>
      <span>Planta</span>
    </div>
    <button class="icon-btn" id="btn-undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"></button>
    <button class="icon-btn" id="btn-redo" title="Rehacer (Ctrl+Mayús+Z)" aria-label="Rehacer"></button>
    <div class="menu-wrap">
      <button class="icon-btn" id="btn-menu" title="Proyecto" aria-label="Menú del proyecto"></button>
      <div class="menu" id="menu" hidden>
        <button data-menu="png">Exportar imagen PNG</button>
        <button data-menu="json">Guardar proyecto (.json)</button>
        <button data-menu="import">Abrir proyecto…</button>
        <hr>
        <button data-menu="demo">Cargar plano de ejemplo</button>
        <button data-menu="new">Empezar plano en blanco</button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="structure">Estructura</button>
    <button data-tab="decor">Decoración</button>
  </nav>
  <div id="panel"></div>
</aside>
<main id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="scene"></g></svg>
  <div id="modebar" hidden></div>
  <div id="toast" hidden></div>
  <div class="hud hud-bl"><div id="scalebar"><i></i><span></span></div></div>
  <div class="hud hud-bc" id="hint"></div>
  <div class="hud hud-br">
    <button class="icon-btn" data-view="grid" title="Rejilla" aria-label="Rejilla"></button>
    <button class="icon-btn" data-view="dims" title="Medidas de todos los muros" aria-label="Medidas de todos los muros"></button>
    <span class="sep"></span>
    <button class="icon-btn" data-view="out" title="Alejar (−)" aria-label="Alejar"></button>
    <button class="zoom-label" data-view="fit" id="zoomlabel" title="Encuadrar (F)">100%</button>
    <button class="icon-btn" data-view="in" title="Acercar (+)" aria-label="Acercar"></button>
    <button class="icon-btn" data-view="fit" title="Encuadrar todo (F)" aria-label="Encuadrar"></button>
  </div>
</main>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="file-bg" accept="image/*" hidden>
<div id="ghost" hidden></div>
<script>
(() => {
'use strict';
/* ─── core.js ─── */
/* Planta · núcleo: constantes, utilidades, geometría, colisiones, modelo de datos, historial y guardado */
/* ════════════════════════ Constantes ════════════════════════ */
const C = {
  paper: '#F4F6F3', ink: '#1C2420', ink2: '#4A544F', muted: '#879089',
  wall: '#1C2420', accent: '#1E7B5F', danger: '#D64545',
  gridMinor: '#E4E8E3', gridMajor: '#D0D7D0', arc: '#7A847E',
};
const ROOM_COLORS = ['#E9C9A6', '#BFD6B8', '#AFC8E2', '#E6C4D2', '#EEDFA8', '#CBC3E6', '#B7DCD6', '#DCCBBE'];
const FURN_COLORS = ['#D8CBBB', '#C2A98C', '#E3CB94', '#A7B79A', '#8FA8BC', '#D2A9A4', '#B9BDB8', '#6F7B73', '#46526A', '#FFFFFF'];
const FONT = '"Avenir Next", Avenir, "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", system-ui, sans-serif';

const PRESETS = [

  { cat: 'Baño', items: [

/* ════════════════════════ Utilidades ════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const snap = (v, step) => Math.round(v / step) * step;
const r3 = v => Math.round(v * 1000) / 1000;
const fmt = (v, d = 2) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
const parseNum = s => { const v = parseFloat(String(s).trim().replace(',', '.')); return Number.isFinite(v) ? v : NaN; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const norm360 = a => ((a % 360) + 360) % 360;

function openingGeom(op, gmap) {

/* ════════════════════════ Colisiones ════════════════════════ */

/* Mueve un mueble respetando muros: se desliza por ellos y "salta" al otro lado si tiras lo suficiente */

  if (!solidAt(f, target.x, target.y, f.rot, G) && V.dist(direct.p, target) > popDist) { f.x = target.x; f.y = target.y; return 'pop'; }

/* ════════════════════════ Operaciones del modelo ════════════════════════ */
function nextRoomName() { let n = doc.rooms.length + 1; while (doc.rooms.some(r => r.name === 'Habitación ' + n)) n++; return 'Habitación ' + n; }
function makeRoom(points, o = {}) {
  return {
    id: uid('r'), name: o.name || nextRoomName(), color: o.color || ROOM_COLORS[doc.rooms.length % ROOM_COLORS.length],
    points: points.map(p => ({ x: r3(p.x), y: r3(p.y) })), thick: points.map(() => (o.t ?? ui.newRoom.t)), labelOffset: { x: 0, y: 0 },
  };
}

  return type === 'door'
    ? { type: 'door', style: 'swing', leaves: 1, swing: 'in', hinge: 'start', width: 0.8 }
    : { type: 'window', style: 'swing', leaves: 2, swing: 'in', hinge: 'start', width: 1.2 };
}
function itemsInside(room) {
  const inP = it => pointInPoly(it, room.points);
  return { furniture: doc.furniture.filter(inP), columns: doc.columns.filter(inP), labels: doc.labels.filter(inP) };

/* Cambiar la longitud de un muro: el vértice final se desplaza y arrastra en paralelo al muro siguiente */
function setEdgeLength(room, i, L) {
  const P = room.points.map(p => ({ ...p })), n = P.length, j = (i + 1) % n, k = (i + 2) % n;

  P[j] = V.add(P[j], V.mul(d, delta));

  room.points = Q;
  return true;
}

  if (len < 0.2) return false;
  const m = V.lerp(a, b, 0.5), half = len / 2;

  room.thick.splice(i + 1, 0, room.thick[i]);

    if (op.roomId !== room.id) continue;
    if (op.edge > i) op.edge++;

  }

  const pts = room.points.filter((_, i) => i !== k);
  if (!isSimplePolygon(pts)) return false;
  const prev = (k - 1 + n) % n, prevLen = V.dist(room.points[prev], room.points[k]);

      select('column', id);
      const c = find('column', id); if (!c) break;
      const t = snapTargets(null);
      drag = { ...base, type: 'column', id, grab: V.sub(w, c), tx: t.x, ty: t.y };

    case 'opening': select('opening', id); drag = { ...base, type: 'opening', id, G: buildGeom() }; break;
    case 'bgimg': {

        drag = { ...base, type: 'bg', grab: V.sub(w, { x: bg.x, y: bg.y }) };
      } else {
        drag = { ...base, type: 'pan', ox0: view.ox, oy0: view.oy, pending: { kind: 'bg' } };

      break;
    }
    case 'bgresize': {
      const bg = doc.bg; if (!bg) break;

    case 'roomlabel': {

      } else drag = { ...base, type: 'pan', ox0: view.ox, oy0: view.oy, pending: { kind: 'room', id, edge: kind === 'wall' ? +el.dataset.edge : null } };

svg.addEventListener('pointermove', e => {
  const sp = screenPt(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, sp);
  if (pinch) { updatePinch(); return; }
  const w = toWorld(sp);
  lastPointerWorld = w;
  if (!drag) {
    if (mode === 'draw') { updateDrawCursor(w); requestRender(); }
    else if (mode === 'place') { updatePlacePreview(w); requestRender(); }
    return;
  }
  if (!drag.moved) { if (Math.hypot(sp.x - drag.sp0.x, sp.y - drag.sp0.y) < 3) return; drag.moved = true; setCursor(); }
  onDrag(drag, sp, w, e);
  requestRender();
});

function onDrag(d, sp, w, e) {
  const th = 9 / view.scale;
  switch (d.type) {
    case 'pan': view.ox = d.ox0 + sp.x - d.sp0.x; view.oy = d.oy0 + sp.y - d.sp0.y; break;
    case 'room': {
      const r = find('room', d.id); if (!r) break;
      const raw = V.sub(w, d.w0), ref = d.pts0[0];
      let dx = snap(ref.x + raw.x, 0.05) - ref.x, dy = snap(ref.y + raw.y, 0.05) - ref.y;
      const bx = bestSnap(d.src.x, d.tgt.x, raw.x, th), by = bestSnap(d.src.y, d.tgt.y, raw.y, th);
      if (bx) dx = bx.delta;
      if (by) dy = by.delta;
      d.guides = { x: bx ? bx.v : null, y: by ? by.v : null };
      r.points = d.pts0.map(p => ({ x: r3(p.x + dx), y: r3(p.y + dy) }));
      for (const o of d.items) { o.it.x = o.x + dx; o.it.y = o.y + dy; }
      break;
    }
    case 'vertex': {
      const r = find('room', d.id); if (!r) break;
      const p = { x: snap(w.x, 0.05), y: snap(w.y, 0.05) };
      const gx = nearestVal(d.tx, w.x, th), gy = nearestVal(d.ty, w.y, th);
      if (gx != null) p.x = gx;
      if (gy != null) p.y = gy;
      const pts = d.pts0.map(q => ({ ...q }));
      pts[d.index] = { x: r3(p.x), y: r3(p.y) };
      if (isSimplePolygon(pts)) r.points = pts;
      d.guides = { x: gx, y: gy };
      syncInspector();
      break;
    }
    case 'edge': {
      const r = find('room', d.id); if (!r) break;
      const i = d.index, j = (i + 1) % d.pts0.length, rawDist = V.dot(V.sub(w, d.w0), d.n);
      let dist;
      d.guides = null;
      if (d.ax) {
        const sgn = Math.sign(d.n[d.ax]), base = d.pts0[i][d.ax], rawC = base + rawDist * sgn;
        let c = snap(rawC, 0.05);
        const t = nearestVal(d.targets, rawC, th);
        if (t != null) { c = t; d.guides = d.ax === 'x' ? { x: t, y: null } : { x: null, y: t }; }
        dist = (c - base) * sgn;
      } else dist = snap(rawDist, 0.01);
      const pts = d.pts0.map(q => ({ ...q }));
      pts[i] = { x: r3(pts[i].x + d.n.x * dist), y: r3(pts[i].y + d.n.y * dist) };
      pts[j] = { x: r3(pts[j].x + d.n.x * dist), y: r3(pts[j].y + d.n.y * dist) };
      if (isSimplePolygon(pts)) r.points = pts;
      syncInspector();
      break;
    }
    case 'furniture': {
      const f = find('furniture', d.id); if (!f) break;
      d.blocked = moveFurniture(f, V.sub(w, d.grab), d.G, e.altKey) === 'blocked';
      const sh = itemShape(f);
      if (!hitsSolid(sh, d.G) && zoneHits(sh, d.G).size === 0) d.lastFree = { x: f.x, y: f.y };
      break;
    }
    case 'rotate': {
      const f = find('furniture', d.id); if (!f) break;
      let a = norm360(Math.atan2(w.y - d.y0, w.x - d.x0) * 180 / Math.PI + 90);
      d.snapAngle = null;
      if (e.shiftKey) { a = norm360(Math.round(a / 15) * 15); d.snapAngle = a; }
      else {
        let best = 4.5;
        for (const t of d.targets) { const df = angDiff(a, t); if (df < best) { best = df; d.snapAngle = t; } }
        a = d.snapAngle != null ? d.snapAngle : Math.round(a);
      }
      a = norm360(a);
      if (e.altKey || !solidAt(f, d.x0, d.y0, a, d.G)) { f.rot = a; f.x = d.x0; f.y = d.y0; d.blocked = false; }
      else {
        const spot = findSpot({ ...f, rot: a }, d.x0, d.y0, a, d.G, 0.4, false);
        if (spot) { f.rot = a; f.x = spot.x; f.y = spot.y; d.blocked = false; } else d.blocked = true;
      }
      const sh = itemShape(f);
      if (!hitsSolid(sh, d.G) && zoneHits(sh, d.G).size === 0) d.lastFree = { x: f.x, y: f.y, rot: f.rot };
      syncInspector();
      break;
    }
    case 'resize': {
      const f = find('furniture', d.id); if (!f) break;
      const f0 = d.f0, c0 = { x: f0.x, y: f0.y }, lp = V.rot(V.sub(w, c0), -f0.rot);
      let nw = f0.w, nh = f0.h, cx = 0, cy = 0;
      if (d.h === 'r') nw = nh = clamp(snap(2 * V.len(V.sub(w, c0)), 0.01), 0.1, 30);
      else if (d.h === 'e') { nw = clamp(snap(lp.x + f0.w / 2, 0.01), 0.1, 30); cx = (nw - f0.w) / 2; }
      else if (d.h === 'w') { nw = clamp(snap(f0.w / 2 - lp.x, 0.01), 0.1, 30); cx = -(nw - f0.w) / 2; }
      else if (d.h === 's') { nh = clamp(snap(lp.y + f0.h / 2, 0.01), 0.1, 30); cy = (nh - f0.h) / 2; }
      else if (d.h === 'n') { nh = clamp(snap(f0.h / 2 - lp.y, 0.01), 0.1, 30); cy = -(nh - f0.h) / 2; }
      const c = V.add(c0, V.rot({ x: cx, y: cy }, f0.rot));
      if (e.altKey || !hitsSolid(itemShape(f, c.x, c.y, f0.rot, nw, nh), d.G)) { f.w = r3(nw); f.h = r3(nh); f.x = c.x; f.y = c.y; d.blocked = false; }
      else d.blocked = true;
      const sh = itemShape(f);
      if (!hitsSolid(sh, d.G) && zoneHits(sh, d.G).size === 0) d.lastFree = { x: f.x, y: f.y, w: f.w, h: f.h };
      syncInspector();
      break;
    }
    case 'opening': {
      const op = find('opening', d.id); if (!op) break;
      const ne = nearestEdge(w, d.G, Math.max(0.5, 36 / view.scale), 0.3);
      if (ne) {
        const ew = Math.min(op.width, ne.e.len), center = (ne.e.len - ew) / 2;
        let off = clamp(snap(ne.along - ew / 2, 0.05), 0, ne.e.len - ew);
        if (Math.abs(ne.along - ew / 2 - center) < 10 / view.scale) off = center;
        op.roomId = ne.roomId; op.edge = ne.edge; op.offset = r3(off);
        syncInspector();
      }
      break;
    }
    case 'column': {
      const c = find('column', d.id); if (!c) break;
      const raw = V.sub(w, d.grab), hw = c.w / 2, hh = (c.shape === 'circle' ? c.w : c.h) / 2;
      const bx = bestSnap([-hw, 0, hw], d.tx, raw.x, th), by = bestSnap([-hh, 0, hh], d.ty, raw.y, th);
      c.x = r3(bx ? bx.delta : snap(raw.x, 0.01)); c.y = r3(by ? by.delta : snap(raw.y, 0.01));
      d.guides = { x: bx ? bx.v : null, y: by ? by.v : null };
      break;
    }
    case 'label': { const l = find('label', d.id); if (l) { l.x = r3(w.x - d.grab.x); l.y = r3(w.y - d.grab.y); } break; }
    case 'roomlabel': { const r = find('room', d.id); if (r) r.labelOffset = { x: r3(w.x - d.grab.x - d.vc.x), y: r3(w.y - d.grab.y - d.vc.y) }; break; }
    case 'bg': {
      const bg = doc.bg; if (!bg) break;
      const p = V.sub(w, d.grab);
      bg.x = r3(p.x); bg.y = r3(p.y);
      break;
    }
    case 'bgresize': {
      const bg = doc.bg; if (!bg) break;
      const anchorLocal = { x: -d.w0 / 2, y: -d.h0 / 2 };
      const aw = V.add(d.c0, V.rot(anchorLocal, d.rot));
      const lp = V.rot(V.sub(w, aw), -d.rot);
      const rawW = Math.max(0.05, lp.x), rawH = Math.max(0.05, lp.y);
      const scale = clamp(V.len({ x: rawW, y: rawH }) / V.len({ x: d.w0, y: d.h0 }), 0.05, 100);
      const newW = r3(d.w0 * scale), newH = r3(d.h0 * scale);
      const c = V.add(aw, V.rot({ x: newW / 2, y: newH / 2 }, d.rot));
      bg.w = Math.max(0.05, newW); bg.h = Math.max(0.05, newH); bg.x = r3(c.x); bg.y = r3(c.y);
      break;
    }
  }
}

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) pinch = null; return; }
  const d = drag; if (!d) return;
  drag = null;
  if (d.type === 'pan') {
    if (!d.moved && d.pending) {
      if (d.pending.kind === 'room') { select('room', d.pending.id); if (d.pending.edge != null) flashWall(d.pending.edge); }
      else if (d.pending.kind === 'bg') { select('bg', 'bg'); }
      else if (sel) select(null);
    }
  } else if (d.type === 'furniture' || d.type === 'rotate' || d.type === 'resize') {
    const f = find('furniture', d.id);
    if (f && d.moved) {
      if (!ui.allowZones && d.lastFree && zoneHits(itemShape(f), d.G).size > 0) {
        Object.assign(f, d.lastFree);
        toast('Ahí no cabe: invade el espacio de apertura de una puerta o ventana', true);
      }
      commit();
    }
  } else if (d.moved) commit();
  if (d.type === 'edge') ui.hoverEdge = null;
  setCursor();
  if (d.moved || d.type !== 'pan') renderPanel();
  requestRender();
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('contextmenu', e => e.preventDefault());
svg.addEventListener('wheel', e => {
  e.preventDefault();
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;
  zoomAt(screenPt(e), Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
}, { passive: false });

function startPinch() {
  drag = null;
  const [a, b] = [...pointers.values()];
  pinch = { d0: Math.max(10, V.dist(a, b)), m0: V.lerp(a, b, 0.5), s0: view.scale, ox0: view.ox, oy0: view.oy };
}
function updatePinch() {
  const [a, b] = [...pointers.values()]; if (!a || !b) return;
  const m = V.lerp(a, b, 0.5), s = clamp(pinch.s0 * V.dist(a, b) / pinch.d0, MIN_SCALE, MAX_SCALE);
  const wx = (pinch.m0.x - pinch.ox0) / pinch.s0, wy = (pinch.m0.y - pinch.oy0) / pinch.s0;
  view.scale = s; view.ox = m.x - wx * s; view.oy = m.y - wy * s;
  requestRender();
}
function flashWall(i) {
  if (!sel || sel.kind !== 'room') return;
  const row = panel.querySelector(`.wall-row[data-hover-edge="${i}"]`);
  if (row) { row.classList.add('hl'); row.scrollIntoView({ block: 'nearest' }); setTimeout(() => row.classList.remove('hl'), 1000); }
  ui.hoverEdge = { roomId: sel.id, edge: i }; requestRender();
  setTimeout(() => { if (ui.hoverEdge && ui.hoverEdge.edge === i && !drag) { ui.hoverEdge = null; requestRender(); } }, 1000);
}

window.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z' && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (typing) return;
  if (e.code === 'Space') { e.preventDefault(); if (!spaceDown) { spaceDown = true; setCursor(); } return; }
  if (mode === 'draw') { drawKey(e); return; }
  if (e.key === 'Escape') { hideMenu(); if (mode === 'place') setMode('select'); else if (sel) select(null); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { if (sel) { e.preventDefault(); deleteSel(); } return; }
  if (k === 'r') { rotateSel(e.shiftKey ? -90 : 90); return; }
  if (k === 'f') { animateView(fitTarget()); return; }
  if (k === '+' || k === '=') { zoomAt(viewCenter(), 1.2); return; }
  if (k === '-') { zoomAt(viewCenter(), 1 / 1.2); return; }
  const st = e.shiftKey ? 0.1 : 0.01;
  const arrows = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] };
  if (arrows[e.key] && sel) { e.preventDefault(); nudge(...arrows[e.key]); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; setCursor(); } });
window.addEventListener('blur', () => { spaceDown = false; setCursor(); });

/* ════════════════════════ Panel: piezas de formulario ════════════════════════ */
function numInput(field, value, o = {}) {
  const unit = o.unit ?? 'm', d = o.d ?? 2;
  return `<span class="inp${unit ? '' : ' nounit'}"><input data-field="${field}"${o.idx != null ? ` data-idx="${o.idx}"` : ''} data-num="1" data-d="${d}" data-step="${o.step ?? 0.01}" value="${fmt(value, d)}" inputmode="decimal" autocomplete="off" spellcheck="false"${o.aria ? ` aria-label="${o.aria}"` : ''}>${unit ? `<em>${unit}</em>` : ''}</span>`;
}
const numField = (label, field, value, o = {}) => `<label class="field"><span>${label}</span>${numInput(field, value, o)}</label>`;
const textField = (label, field, value, o = {}) =>
  `<label class="field"><span>${label}</span><span class="inp nounit"><input data-field="${field}" data-live="1" value="${esc(value)}" maxlength="40" autocomplete="off" spellcheck="false"${o.placeholder ? ` placeholder="${o.placeholder}"` : ''}></span></label>`;
const labeled = (label, inner) => `<div class="field"><span>${label}</span>${inner}</div>`;
const segCtl = (field, options, value) =>
  `<div class="seg" role="group">${options.map(([v, l]) => `<button type="button" data-act="set" data-field="${field}" data-value="${v}" class="${String(v) === String(value) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
function swatches(field, colors, value) {
  const cur = String(value).toLowerCase(), known = colors.some(c => c.toLowerCase() === cur);
  return `<div class="swatches">${colors.map(c => `<button type="button" class="sw${c.toLowerCase() === cur ? ' on' : ''}" style="background:${c}" data-act="set" data-field="${field}" data-value="${c}" aria-label="Color ${c}"></button>`).join('')}` +
    `<label class="sw sw-custom${known ? '' : ' on'}" title="Otro color"><input type="color" data-field="${field}" data-live="1" value="${esc(value)}"></label></div>`;
}
const toolBtn = (t, label) => `<button class="tool${mode === 'place' && ui.placeType === t ? ' on' : ''}" data-act="tool" data-tool="${t}">${icon(t === 'label' ? 'tag' : t, 22)}${label}</button>`;
const actionsRow = (o = {}) => `<section class="sec row-actions">${o.rotate ? `<button class="btn" data-act="rotate" data-deg="90">${icon('rotate')}Girar 90°</button>` : ''}<button class="btn" data-act="duplicate" title="Duplicar (Ctrl+D)">${icon('copy')}Duplicar</button><button class="btn danger" data-act="delete" title="Eliminar (Supr)" aria-label="Eliminar">${icon('trash')}</button></section>`;

function shapePreview(pts) {
  const b = bboxOf(pts), bw = Math.max(0.1, b.maxX - b.minX), bh = Math.max(0.1, b.maxY - b.minY);
  const s = Math.min(150 / bw, 76 / bh), W = bw * s + 12, H = bh * s + 12;
  const d = 'M' + pts.map(p => `${((p.x - b.minX) * s + 6).toFixed(1)},${((p.y - b.minY) * s + 6).toFixed(1)}`).join('L') + 'Z';
  return `<svg width="${W.toFixed(0)}" height="${H.toFixed(0)}" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" aria-hidden="true"><path d="${d}" fill="${ROOM_COLORS[doc.rooms.length % ROOM_COLORS.length]}" fill-opacity=".6" stroke="${C.ink}" stroke-width="3.5" stroke-linejoin="miter"/></svg>`;
}
function presetGlyph(it) {
  const S = 26, m = Math.max(it.w, it.h), k = (S - 4) / m;
  const w = Math.max(3, it.w * k), h = Math.max(3, (it.shape === 'circle' ? it.w : it.h) * k), st = shade(it.color, -0.35);
  const inner = it.shape === 'circle'
    ? `<circle cx="${S / 2}" cy="${S / 2}" r="${(w / 2).toFixed(1)}" fill="${it.color}" stroke="${st}"/>`
    : `<rect x="${((S - w) / 2).toFixed(1)}" y="${((S - h) / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${it.color}" stroke="${st}"/>`;
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" aria-hidden="true">${inner}</svg>`;
}

function bgHTML() {
  const bg = doc.bg;
  let h = `<section class="sec"><div class="sec-title">Imagen de fondo</div>`;
  if (!bg) {
    h += `<p class="note">Sube una foto o captura del plano de la promoción (PDF exportado a imagen, folleto, escaneo…) para dibujar las habitaciones y los muebles encima.</p>`;

  } else {
    h += `<button class="list-row" data-act="select" data-kind="bg" data-id="bg"><i class="swatch-dot" style="background:#ccc"></i><span class="name">Imagen del plano</span><span class="val">${Math.round(bg.opacity * 100)}%</span></button>`;
    h += `<div class="grid2" style="margin-top:8px"><button class="btn" data-act="bg-toggle-visible">${bg.visible !== false ? 'Ocultar' : 'Mostrar'}</button><button class="btn" data-act="bg-toggle-lock">${bg.locked ? 'Desbloquear' : 'Bloquear'}</button></div>`;

}
function structureHTML() {

    if (nr.shape === 'L') h += numField('Ancho total', 'newRoom.w', nr.w) + numField('Largo total', 'newRoom.h', nr.h) + numField('Ancho del hueco', 'newRoom.cw', nr.cw) + numField('Largo del hueco', 'newRoom.ch', nr.ch);
    if (nr.shape === 'poly') h += numField('Número de lados', 'newRoom.sides', nr.sides, { unit: '', d: 0, step: 1 }) + numField('Longitud de lado', 'newRoom.side', nr.side);

/* ════════════════════════ Panel: render y sincronización ════════════════════════ */
let panelCtx = '';
function renderPanel() {
  if (sel && !selObj()) sel = null;
  const ae = document.activeElement;
  const keep = ae && panel.contains(ae) && ae.dataset && ae.dataset.field ? { f: ae.dataset.field, i: ae.dataset.idx, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const ctx = sel ? sel.kind + ':' + sel.id : 'tab:' + ui.tab;
  const st = panel.scrollTop;
  panel.innerHTML = sel ? inspectorHTML(sel.kind, selObj()) : ui.tab === 'decor' ? decorHTML() : structureHTML();
  panel.scrollTop = ctx === panelCtx ? st : 0;
  panelCtx = ctx;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  if (keep) {
    const el = panel.querySelector(`[data-field="${keep.f}"]${keep.i != null ? `[data-idx="${keep.i}"]` : ':not([data-idx])'}`);
    if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (_) { /* inputs sin selección */ } }
  }
  updateUndo();
}

function getField(field, idx) {
  const [ns, key] = field.split('.'), o = selObj();
  if (ns === 'newRoom') return ui.newRoom[key];
  if (!o) return undefined;
  if (ns === 'room') {
    if (key === 'edgeLen') { const n = o.points.length, i = +idx; return i < n ? V.dist(o.points[i], o.points[(i + 1) % n]) : undefined; }
    if (key === 'thick') return o.thick[+idx];
    if (key === 'allThick') return o.thick[0];
  }
  if ((ns === 'f' || ns === 'col') && key === 'd') return o.w;
  if (ns === 'f' && key === 'rot') return o.rot || 0;
  if (ns === 'bg') { if (key === 'opacity') return (o.opacity || 0) * 100; if (key === 'rot') return o.rot || 0; }
  return o[key];
}
function syncInspector() {
  if (!sel) return;
  const o = selObj(); if (!o) return;
  panel.querySelectorAll('input[data-field]').forEach(inp => {
    if (inp === document.activeElement) return;
    const v = getField(inp.dataset.field, inp.dataset.idx);
    if (v === undefined) return;
    if (inp.type === 'range') inp.value = Math.round(v);
    else if (inp.dataset.num) inp.value = fmt(v, +inp.dataset.d);
    else if (inp.type !== 'color') inp.value = v;
  });
  panel.querySelectorAll('[data-bind]').forEach(el => {
    let v = null;
    switch (el.dataset.bind) {
      case 'title': v = sel.kind === 'room' ? esc(o.name) : sel.kind === 'furniture' ? esc(o.name || 'Sin nombre') : sel.kind === 'label' ? esc(o.text) : sel.kind === 'opening' ? whereOpening(o) : null; break;
      case 'area': v = fmt(polyArea(o.points)) + ' m²'; break;
      case 'perim': v = fmt(perimeter(o.points)) + ' m'; break;
      case 'warn': v = furnWarn(o); break;
    }
    if (v != null && el.innerHTML !== v) el.innerHTML = v;
  });
}

function setField(field, raw, isCommit, idx) {
  const [ns, key] = field.split('.'), o = selObj(), v = parseNum(raw);
  let rebuild = isCommit;
  switch (ns) {
    case 'newRoom': {
      if (key === 'shape') ui.newRoom.shape = raw;
      else if (isNaN(v)) break;
      else if (key === 'sides') ui.newRoom.sides = clamp(Math.round(v), 3, 12);
      else if (key === 't') ui.newRoom.t = r3(clamp(v, 0, 1));
      else ui.newRoom[key] = r3(clamp(v, 0.3, 100));
      renderPanel();
      return;
    }
    case 'room': {
      if (!o) return;
      if (key === 'name') { o.name = String(raw).slice(0, 40); rebuild = false; }
      else if (key === 'color') { o.color = raw; if (!isCommit) { requestRender(); return; } }
      else if (key === 'edgeLen') {
        if (isNaN(v) || v < 0.1) toast('La longitud mínima de un muro es 0,10 m', true);
        else if (!setEdgeLength(o, +idx, r3(v))) toast('Con esa medida la forma se cruzaría consigo misma. Prueba otro valor o arrastra los vértices.', true);
      } else if (key === 'thick') { if (!isNaN(v)) o.thick[+idx] = r3(clamp(v, 0, 1)); }
      else if (key === 'allThick') { if (!isNaN(v)) o.thick = o.thick.map(() => r3(clamp(v, 0, 1))); }
      break;
    }
    case 'op': {
      if (!o) return;
      const r = find('room', o.roomId), e = r && roomGeom(r).edges[o.edge];
      if (key === 'type') { o.type = raw === 'window' ? 'window' : 'door'; }
      else if (key === 'style') o.style = raw === 'sliding' ? 'sliding' : 'swing';
      else if (key === 'leaves') o.leaves = +raw === 2 ? 2 : 1;
      else if (key === 'width' && e && !isNaN(v)) { o.width = r3(clamp(v, 0.3, e.len)); o.offset = r3(clamp(o.offset, 0, Math.max(0, e.len - o.width))); }
      else if (key === 'offset' && e && !isNaN(v)) o.offset = r3(clamp(v, 0, Math.max(0, e.len - Math.min(o.width, e.len))));
      break;
    }
    case 'f': {
      if (!o) return;
      if (key === 'name') { o.name = String(raw).slice(0, 40); rebuild = false; }
      else if (key === 'color') { o.color = raw; if (!isCommit) { requestRender(); return; } }
      else if (key === 'shape') {
        const shape = raw === 'circle' ? 'circle' : 'rect';
        if (shape !== o.shape) { const m = r3(Math.min(o.w, o.h)); applyFurn(o, { ...o, shape, w: shape === 'circle' ? m : o.w, h: shape === 'circle' ? m : o.h }); }
      } else if (key === 'w' || key === 'h' || key === 'd') {
        if (!isNaN(v)) { const val = r3(clamp(v, 0.05, 30)), nx = { ...o }; if (key === 'd') nx.w = nx.h = val; else nx[key] = val; applyFurn(o, nx); }
      } else if (key === 'rot') {
        if (!isNaN(v)) applyFurn(o, { ...o, rot: norm360(Math.round(v * 10) / 10) });
        if (!isCommit) { syncInspector(); requestRender(); return; }
      }
      break;
    }
    case 'col': {
      if (!o) return;
      if (key === 'shape') o.shape = raw === 'circle' ? 'circle' : 'rect';
      else if (!isNaN(v)) { const val = r3(clamp(v, 0.05, 5)); if (key === 'd') { o.w = val; o.h = val; } else o[key] = val; }
      break;
    }
    case 'label': {
      if (!o) return;
      if (key === 'text') { o.text = String(raw).slice(0, 60); rebuild = false; }
      else if (key === 'size') o.size = raw;
      break;
    }
    case 'bg': {
      if (!o) return;
      if (key === 'w') { if (!isNaN(v)) { const val = clamp(v, 0.1, 500); o.w = r3(val); o.h = r3(val / (o.ar || (o.w / o.h) || 1)); } }
      else if (key === 'opacity') { if (!isNaN(v)) o.opacity = clamp(v / 100, 0.05, 1); if (!isCommit) { requestRender(); return; } }
      else if (key === 'rot') { if (!isNaN(v)) o.rot = norm360(Math.round(v * 10) / 10); if (!isCommit) { requestRender(); return; } }
      break;
    }
  }
  if (isCommit) commit();
  if (rebuild) renderPanel(); else syncInspector();
  requestRender();
}

/* ════════════════════════ Panel: eventos ════════════════════════ */
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !panel.contains(b) || b.disabled) return;
  const a = b.dataset.act, o = selObj(), idx = b.dataset.idx != null ? +b.dataset.idx : null;
  switch (a) {
    case 'set': setField(b.dataset.field, b.dataset.value, true, b.dataset.idx); break;
    case 'create-room': createRoomFromPanel(); break;
    case 'tool': startTool(b.dataset.tool); break;
    case 'select': {
      select(b.dataset.kind, b.dataset.id);
      const it = selObj();
      if (it && b.dataset.kind === 'room') ensureVisible(roomGeom(it).bbox);
      break;
    }
    case 'back': select(null); break;
    case 'delete': deleteSel(); break;
    case 'duplicate': duplicateSel(); break;
    case 'rotate': rotateSel(+b.dataset.deg || 90); break;
    case 'split': if (o && splitEdge(o, idx)) { commit(); renderPanel(); requestRender(); } else toast('Ese muro es demasiado corto para dividirlo', true); break;
    case 'merge': if (o && removeVertex(o, (idx + 1) % o.points.length)) { commit(); renderPanel(); requestRender(); } else toast('No se pueden unir: la forma quedaría inválida', true); break;
    case 'flip-swing': if (o) { o.swing = o.swing === 'out' ? 'in' : 'out'; commit(); renderPanel(); requestRender(); } break;
    case 'flip-hinge': if (o) { o.hinge = o.hinge === 'end' ? 'start' : 'end'; commit(); requestRender(); } break;
    case 'center': {
      const r = o && find('room', o.roomId), e2 = r && roomGeom(r).edges[o.edge];
      if (e2) { o.offset = r3(Math.max(0, (e2.len - Math.min(o.width, e2.len)) / 2)); commit(); syncInspector(); requestRender(); }
      break;
    }
    case 'rot-set': setField('f.rot', b.dataset.value, true); break;
    case 'toggle': ui[b.dataset.key] = !ui[b.dataset.key]; renderPanel(); requestRender(); break;
    case 'bg-add': case 'bg-replace': $('#file-bg').click(); break;
    case 'bg-toggle-lock': if (doc.bg) { doc.bg.locked = !doc.bg.locked; commit(); renderPanel(); requestRender(); } break;
    case 'bg-toggle-visible': if (doc.bg) { doc.bg.visible = doc.bg.visible === false; commit(); renderPanel(); requestRender(); } break;
  }
});
panel.addEventListener('input', e => {

const edgeRowOn = row => { if (row && sel && sel.kind === 'room') { const i = +row.dataset.hoverEdge; if (!ui.hoverEdge || ui.hoverEdge.edge !== i) { ui.hoverEdge = { roomId: sel.id, edge: i }; requestRender(); } } };

/* Biblioteca de muebles: clic para añadir, arrastrar para soltar en el plano */
panel.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-preset]');
  if (!t || e.button !== 0) return;
  const [ci, ii] = t.dataset.preset.split(':').map(Number);
  libDrag = { pr: PRESETS[ci].items[ii], x0: e.clientX, y0: e.clientY, touch: e.pointerType === 'touch', f: null, G: null };
});
window.addEventListener('pointermove', e => {
  const L = libDrag;
  if (!L || L.touch) return;
  if (!L.f && Math.hypot(e.clientX - L.x0, e.clientY - L.y0) < 6) return;
  const ghost = $('#ghost'), r = svg.getBoundingClientRect();
  const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  const w = toWorld({ x: e.clientX - r.left, y: e.clientY - r.top });
  document.body.classList.add('dragging');
  if (!L.f) {
    if (!over) { ghost.textContent = L.pr.label || L.pr.name; ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; ghost.hidden = false; return; }
    ghost.hidden = true;
    if (mode !== 'select') setMode('select');
    L.f = { id: uid('f'), name: L.pr.name, shape: L.pr.shape, x: w.x, y: w.y, w: L.pr.w, h: L.pr.h, rot: 0, color: L.pr.color };
    doc.furniture.push(L.f);
    L.G = buildGeom();
    select('furniture', L.f.id);
  } else { L.f.x = w.x; L.f.y = w.y; }
  L.over = over;
  requestRender();
});
window.addEventListener('pointerup', e => {
  const L = libDrag; if (!L) return;
  libDrag = null;
  $('#ghost').hidden = true; document.body.classList.remove('dragging');
  if (!L.f) {
    if (Math.hypot(e.clientX - L.x0, e.clientY - L.y0) < 10 && e.target.closest && e.target.closest('[data-preset]')) {
      if (mode !== 'select') setMode('select');
      const f = addFurniture(L.pr);
      select('furniture', f.id); commit();
      ensureVisible(itemShape(f).bbox);
    }
    return;
  }
  const f = L.f;
  if (!L.over) {   // soltado fuera del lienzo: se cancela
    doc.furniture = doc.furniture.filter(x => x !== f);
    sel = null; renderPanel(); requestRender();
    return;
  }
  const sh = itemShape(f);
  if (hitsSolid(sh, L.G) || (!ui.allowZones && zoneHits(sh, L.G).size)) {
    const spot = findSpot(f, f.x, f.y, f.rot, L.G, 1.5, !ui.allowZones);
    if (spot) { f.x = spot.x; f.y = spot.y; }
    else toast('No hay hueco libre cerca: queda marcado en rojo para que lo recoloques', true);
  }
  commit(); renderPanel(); requestRender();
});
window.addEventListener('pointercancel', () => { if (libDrag) { libDrag = null; $('#ghost').hidden = true; document.body.classList.remove('dragging'); } });

/* ════════════════════════ Cabecera, pestañas, HUD y menú ════════════════════════ */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab;
  if (mode !== 'select') setMode('select');
  sel = null; renderPanel(); requestRender();
});
$('#btn-undo').addEventListener('click', undo);
$('#btn-redo').addEventListener('click', redo);
$('#btn-menu').addEventListener('click', e => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; });
function hideMenu() { $('#menu').hidden = true; }
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) hideMenu(); });
$('#menu').addEventListener('click', e => { const b = e.target.closest('[data-menu]'); if (b) menuAction(b.dataset.menu); });
$('.hud-br').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  const a = b.dataset.view;
  if (a === 'in') zoomAt(viewCenter(), 1.25);
  if (a === 'out') zoomAt(viewCenter(), 0.8);
  if (a === 'fit') animateView(fitTarget());
  if (a === 'grid') { ui.grid = !ui.grid; requestRender(); }
  if (a === 'dims') { ui.allDims = !ui.allDims; requestRender(); }
});
$('#modebar').addEventListener('click', e => {
  const b = e.target.closest('[data-mb]'); if (!b) return;
  if (b.dataset.mb === 'cancel') setMode('select');
  if (b.dataset.mb === 'finish') { finishDraw(); requestRender(); }
});

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function replaceDoc(d, msg) {
  if (mode !== 'select') setMode('select');
  doc = d; sel = null; commit(); renderPanel(); requestRender(); animateView(fitTarget());
  if (msg) toast(msg);
}
function menuAction(a) {
  hideMenu();
  if (a === 'new') replaceDoc(emptyDoc(), 'Plano en blanco. Ctrl+Z recupera el anterior');
  if (a === 'demo') replaceDoc(demoDoc(), 'Plano de ejemplo cargado');
  if (a === 'json') downloadBlob(new Blob([JSON.stringify({ app: 'planta', version: 1, ...doc }, null, 2)], { type: 'application/json' }), 'plano.json');
  if (a === 'import') $('#file').click();
  if (a === 'png') exportPNG();
}
$('#file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try { const d = sanitize(JSON.parse(await file.text())); if (!d) throw new Error('inválido'); replaceDoc(d, 'Proyecto abierto'); }
  catch (_) { toast('Ese archivo no es un proyecto válido de Planta', true); }
});
$('#file-bg').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Elige un archivo de imagen (PNG o JPG)', true); return; }
  try { await setBgFromFile(file); renderPanel(); toast('Imagen de fondo cargada'); }
  catch (err) { toast(err.message || 'No se pudo cargar la imagen', true); }
});
function exportPNG() {
  const b = docBounds();
  if (!b) { toast('El plano está vacío', true); return; }
  const pad = 0.7, wm = b.maxX - b.minX + pad * 2, hm = b.maxY - b.minY + pad * 2;
  const scale = Math.min(2600 / wm, 2600 / hm, 260), W = Math.ceil(wm * scale), H = Math.ceil(hm * scale);
  const v = { scale, ox: -(b.minX - pad) * scale, oy: -(b.minY - pad) * scale };
  const prevSel = sel; sel = null;
  const inner = renderScene(v, W, H, { export: true, uk: Math.max(1, scale / 90) });
  sel = prevSel; RV = view; UK = 1; CUT_FILL = C.paper;
  const str = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family='${FONT}'><rect width="${W}" height="${H}" fill="#FFFFFF"/>${inner}</svg>`;
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, 0, 0);
    cv.toBlob(blob => { if (blob) { downloadBlob(blob, 'plano.png'); toast('Imagen exportada'); } else toast('No se pudo generar la imagen', true); }, 'image/png');
  };
  img.onerror = () => toast('No se pudo generar la imagen', true);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}

/* ════════════════════════ Arranque ════════════════════════ */
async function init() {
  renderPanel();
  const saved = sanitize(await load());
  doc = saved || demoDoc();
  resetHistory();
  renderPanel();
  Object.assign(view, fitTarget());
  render();
  new ResizeObserver(() => requestRender()).observe(stage);
}
init();

})();
</script>
